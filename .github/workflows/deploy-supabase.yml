name: Deploy Supabase

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-supabase.yml"
      - "supabase/**"
  workflow_dispatch:

concurrency:
  group: supabase-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy migrations and functions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test Supabase Edge Functions
        run: |
          deno test --allow-env --allow-net \
            supabase/functions/create-telegram-link/handler.test.ts \
            supabase/functions/submit-invite/handler.test.ts \
            supabase/functions/verify-phone-otp/handler.test.ts \
            supabase/functions/accept-invite/handler.test.ts \
            supabase/functions/send-phone-otp/handler.test.ts \
            supabase/functions/set-telegram-host-notifications/handler.test.ts \
            supabase/functions/telegram-webhook/handler.test.ts

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate deployment secrets
        run: |
          test -n "${SUPABASE_ACCESS_TOKEN}" || (echo "SUPABASE_ACCESS_TOKEN is missing" && exit 1)
          test -n "${SUPABASE_DB_PASSWORD}" || (echo "SUPABASE_DB_PASSWORD is missing" && exit 1)
          test -n "${SUPABASE_PROJECT_ID}" || (echo "SUPABASE_PROJECT_ID is missing" && exit 1)

      - name: Link Supabase project
        run: supabase link --project-ref "${SUPABASE_PROJECT_ID}"

      - name: Apply database migrations
        run: supabase db push

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy telegram-webhook --no-verify-jwt
          supabase functions deploy create-telegram-link
          supabase functions deploy set-telegram-host-notifications
          supabase functions deploy accept-invite
          supabase functions deploy submit-invite --no-verify-jwt
          supabase functions deploy send-phone-otp
          supabase functions deploy verify-phone-otp
          supabase functions deploy activate-safety-pack
          supabase functions deploy ack-safety-pack --no-verify-jwt
          supabase functions deploy safety-alert
          supabase functions deploy safety-checkin-reminder --no-verify-jwt
