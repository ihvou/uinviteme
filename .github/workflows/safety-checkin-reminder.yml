name: Safety Check-In Reminder

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  process-safety-checkins:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Invoke Safety Pack scheduler
        env:
          SAFETY_CRON_SECRET: ${{ secrets.SAFETY_CRON_SECRET }}
        run: |
          curl --fail --show-error --silent \
            --request POST \
            --header "Content-Type: application/json" \
            --header "x-safety-cron-secret: ${SAFETY_CRON_SECRET}" \
            --data '{}' \
            "https://vvjgrvltnnqoiijoufry.supabase.co/functions/v1/safety-checkin-reminder"
